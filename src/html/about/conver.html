<section class="conver mb-0">
    <div class="container">
        <div class="conver__content">
            <h2 class="h2 conver__title">Доверьте организацию <br> перелёта профессионалам</h2>
            <div class="conver__descr">
                Расскажите о своей задаче — мы подберём оптимальное <br> решение и возьмём на себя все вопросы <br> по организации перелёта.
            </div>
            <form class="conver__form">
                <div class="form__grid">
                    <div class="form__input form__input--name">
                        <input type="text" class="w-100" name="name" placeholder="Имя*" required>
                    </div>
                    <div class="form__input form__input--tel">
                        <input type="tel" class="w-100" name="tel" placeholder="Телефон*" required>
                    </div>
                    <div class="form__input form__input--mail">
                        <input type="email" class="w-100" name="mail" placeholder="Email">
                    </div>
                    <div class="form__input form__input--textarea">
                        <textarea name="text" class="w-100" placeholder="Комментарий"></textarea>
                    </div>
                    <div class="form__input--wrapper">
                        <div class="form__checkbox">
                            <input type="checkbox" name="return" id="return">
                            <label for="return" class="form__checkbox-text">Согласен с условиями <a href="#" target="_blank">оферты</a> и <a href="#" target="_blank">политики конфиденциальности</a></label>
                        </div>
                        <button type="submit" class="btn w-100"><span>Получить предложение</span></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
